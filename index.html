<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💬 My Chat App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- ====== لاگن اسکرین ====== -->
    <div id="loginScreen" class="screen active">
        <div class="container">
            <div class="logo">💬</div>
            <h1 id="appTitle">My Chat</h1>
            <p class="subtitle" id="loginSubtitle">Enter your name and number</p>
            
            <input type="text" id="username" placeholder="👤 Your Name" class="input-field">
            <input type="text" id="phoneNumber" placeholder="📱 Phone (e.g. 03001234567)" class="input-field">
            
            <button onclick="login()" class="btn btn-primary" id="loginBtn">🚀 Start Chat</button>
            
            <div id="loginError" class="error-message"></div>
            
            <!-- ====== Language Toggle ====== -->
            <div class="language-toggle">
                <button onclick="setLanguage('ur')" class="lang-btn" id="langUr">🇵🇰 اردو</button>
                <button onclick="setLanguage('en')" class="lang-btn" id="langEn">🇬🇧 English</button>
            </div>
        </div>
    </div>
    
    <!-- ====== چیٹ اسکرین ====== -->
    <div id="chatScreen" class="screen">
        <!-- ہیڈر -->
        <div class="chat-header">
            <div>
                <h2 id="chatTitle">💬 My Chat</h2>
                <span id="onlineCount" class="online-badge">🟢 0 online</span>
            </div>
            <div class="header-buttons">
                <button onclick="toggleLanguage()" class="btn-lang" id="langToggleBtn" title="Change Language">
                    🌐
                </button>
                <button onclick="logout()" class="btn-logout" title="Logout">🚪</button>
            </div>
        </div>
        
        <!-- میسجز کا باکس -->
        <div id="messagesContainer" class="messages-container">
            <div class="welcome-message" id="welcomeMsg">
                👋 Welcome!<br>
                <small>Start typing your message</small>
            </div>
        </div>
        
        <!-- ان پٹ -->
        <div class="chat-input">
            <input type="text" id="messageInput" placeholder="✏️ Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()" class="btn-send">📤</button>
        </div>
    </div>
    
    <!-- ====== سائیڈ بار ====== -->
    <div id="usersSidebar" class="sidebar">
        <div class="sidebar-header">
            <h3 id="onlineTitle">👥 Online</h3>
            <button onclick="toggleSidebar()" class="sidebar-close">✕</button>
        </div>
        <div id="usersList">
            <div class="user-item">
                <span class="dot"></span>
                You
            </div>
            <div class="user-item">
                <span class="dot"></span>
                Friend 1
            </div>
            <div class="user-item">
                <span class="dot"></span>
                Friend 2
            </div>
        </div>
    </div>
    
    <!-- سائیڈ بار ٹوگل بٹن -->
    <button onclick="toggleSidebar()" class="sidebar-toggle">👥</button>
    
    <script src="languages.js"></script>
    <script src="script.js"></script>
</body>
                </html>
